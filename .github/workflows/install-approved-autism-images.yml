name: Install approved autism illustrations
on:
  push:
    paths:
      - 'tmp-autism-assets/ready.txt'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble images
        run: |
          cat tmp-autism-assets/individuel.part* | base64 -d > assets/illustration-autisme-individuel.webp
          cat tmp-autism-assets/collectif.part* | base64 -d > assets/illustration-autisme-collectif.webp
          cat tmp-autism-assets/outils.part* | base64 -d > assets/illustration-autisme-outils.webp
          rm -rf tmp-autism-assets
          rm -f .github/workflows/install-approved-autism-images.yml
      - name: Commit approved images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install approved autism page illustrations"
          git push
