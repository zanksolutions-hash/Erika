name: Upscale autism illustrations

on:
  push:
    paths:
      - '.github/workflows/upscale-autism.yml'

permissions:
  contents: write

jobs:
  upscale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Upscale illustrations for desktop
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path

          files = [
              Path("assets/illustration-autisme-emploi.webp"),
              Path("assets/illustration-autisme-individuel.webp"),
              Path("assets/illustration-autisme-collectif.webp"),
              Path("assets/illustration-autisme-outils.webp"),
          ]

          for path in files:
              im = Image.open(path).convert("RGB")
              w, h = im.size
              hi = im.resize((w * 3, h * 3), Image.Resampling.LANCZOS)
              hi = hi.filter(ImageFilter.UnsharpMask(radius=1.0, percent=115, threshold=2))
              hi.save(path, "WEBP", quality=100, method=6)
              print(f"{path}: {w}x{h} -> {w*3}x{h*3}")
          PY

      - name: Commit high-resolution assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/illustration-autisme-*.webp
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Upscale autism illustrations for desktop"
            git push
          fi
